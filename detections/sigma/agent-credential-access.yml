title: AI Agent Credential Access After Untrusted Content
id: 8f3c2a1b-9d4e-4c7a-b5f2-1e6d8a9c0b3d
status: experimental
description: |
  Detects an AI agent or MCP tool that accesses credential-related paths
  shortly after processing content from an external or untrusted source.
references:
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
tags:
  - attack.credential_access
  - attack.t1552
logsource:
  category: process_creation
  product: linux
detection:
  selection_untrusted:
    CommandLine|contains:
      - 'tool_call'
      - 'mcp'
      - 'agent'
  selection_credential:
    CommandLine|contains:
      - '.ssh'
      - '.aws'
      - 'credentials'
      - 'id_rsa'
      - '.env'
  timeframe: 5m
  condition: selection_untrusted and selection_credential
falsepositives:
  - Legitimate administrative scripts that intentionally read credentials
level: high
