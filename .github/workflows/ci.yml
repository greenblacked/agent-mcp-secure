name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vulnerable example must produce findings
        run: |
          output=$(python3 checks/scan.py checks/examples/vulnerable-tools.json)
          echo "$output"
          echo "$output" | grep -q "steering_language" || (echo "Expected steering_language finding" && exit 1)
          echo "$output" | grep -q "sensitive_path_reference" || (echo "Expected sensitive_path_reference finding" && exit 1)
          echo "Vulnerable example produced expected findings"

      - name: Safe example must produce no findings
        run: |
          output=$(python3 checks/scan.py checks/examples/safe-tools.json)
          echo "$output"
          echo "$output" | grep -q "No high-signal findings" || (echo "Expected clean result" && exit 1)
          echo "Safe example produced no findings"

      - name: Verify hardened example syntax
        run: |
          python3 -m py_compile examples/hardened-mcp-server/server.py
          echo "Hardened example compiles"
