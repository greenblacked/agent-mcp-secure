name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are cancelled; every push to main runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Third-party actions are pinned to commit SHAs; the trailing comment is the release tag.
jobs:
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check checks/ examples/hardened-mcp-server/

      # Runs even if lint failed, so one CI round reports every problem.
      - name: Ruff format check
        if: ${{ !cancelled() }}
        run: ruff format --check checks/ examples/hardened-mcp-server/

  # Separate job so lint failures can never hide test failures.
  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (pyproject requires-python), the action's version, and newest.
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        working-directory: checks
        run: python3 -m unittest test_scan.py test_scan_config.py -v

      - name: Vulnerable example must produce findings and exit 1
        if: ${{ !cancelled() }}
        run: |
          rc=0
          output=$(python3 checks/scan.py checks/examples/vulnerable-tools.json) || rc=$?
          echo "$output"
          [ "$rc" -eq 1 ] || { echo "Expected exit code 1, got $rc"; exit 1; }
          for t in steering_language sensitive_path_reference; do
            echo "$output" | grep -q "$t" || { echo "Expected $t finding"; exit 1; }
          done

      - name: Safe example must produce no findings and exit 0
        if: ${{ !cancelled() }}
        run: |
          output=$(python3 checks/scan.py checks/examples/safe-tools.json)
          echo "$output"
          echo "$output" | grep -q "No high-signal findings" || { echo "Expected clean result"; exit 1; }

      - name: Risky launch config must exit 1
        if: ${{ !cancelled() }}
        run: |
          rc=0
          python3 checks/scan_config.py checks/examples/risky-launch.json || rc=$?
          [ "$rc" -eq 1 ] || { echo "Expected exit code 1, got $rc"; exit 1; }

      - name: Composite action passes on safe tools
        if: ${{ !cancelled() }}
        uses: ./.github/actions/scan-tools
        with:
          path: checks/examples/safe-tools.json

      - name: Composite action fails on vulnerable tools
        id: action-vulnerable
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/scan-tools
        with:
          path: checks/examples/vulnerable-tools.json

      - name: Assert composite action failed
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.action-vulnerable.outcome }}
        run: '[ "$OUTCOME" = "failure" ] || { echo "Expected the action to fail, outcome=$OUTCOME"; exit 1; }'

      - name: Verify hardened example syntax
        if: ${{ !cancelled() }}
        run: python3 -m py_compile examples/hardened-mcp-server/server.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Keyed on the rustc version so a toolchain update starts a fresh cache
      # instead of restoring and growing stale build artifacts.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-

      - name: Check formatting
        run: cargo fmt --check

      # Clippy and tests still run when formatting fails, so real failures are not hidden.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --locked

      - name: Build release
        if: ${{ !cancelled() }}
        run: cargo build --locked --release

      - name: CLI exit codes match the Python scanner
        if: ${{ !cancelled() }}
        run: |
          bin=target/release/agent-mcp-secure
          expect() {
            local want=$1; shift
            local got=0
            "$bin" "$@" >/dev/null || got=$?
            [ "$got" -eq "$want" ] || { echo "Expected exit $want, got $got: $*"; exit 1; }
          }
          expect 1 ../checks/examples/vulnerable-tools.json
          expect 0 --fail-on none ../checks/examples/vulnerable-tools.json
          expect 0 ../checks/examples/safe-tools.json
          expect 2 missing.json
