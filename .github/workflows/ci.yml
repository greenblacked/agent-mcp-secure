name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static checks on example tools
        run: |
          python3 checks/scan.py checks/examples/vulnerable-tools.json
          # Expect findings; fail only on unexpected crash
          echo "Scanner completed"

      - name: Verify hardened example syntax
        run: |
          python3 -m py_compile examples/hardened-mcp-server/server.py
          echo "Hardened example compiles"

  # Optional future jobs: worker build, additional tests
