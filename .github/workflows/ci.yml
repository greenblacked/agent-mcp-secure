name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check checks/ examples/hardened-mcp-server/

      - name: Ruff format check
        run: ruff format --check checks/ examples/hardened-mcp-server/

      - name: Unit tests
        working-directory: checks
        run: python3 -m unittest test_scan.py -v

      - name: Vulnerable example must produce findings
        run: |
          output=$(python3 checks/scan.py checks/examples/vulnerable-tools.json)
          echo "$output"
          echo "$output" | grep -q "steering_language" || (echo "Expected steering_language finding" && exit 1)
          echo "$output" | grep -q "sensitive_path_reference" || (echo "Expected sensitive_path_reference finding" && exit 1)
          echo "Vulnerable example produced expected findings"

      - name: Safe example must produce no findings
        run: |
          output=$(python3 checks/scan.py checks/examples/safe-tools.json)
          echo "$output"
          echo "$output" | grep -q "No high-signal findings" || (echo "Expected clean result" && exit 1)
          echo "Safe example produced no findings"

      - name: Verify hardened example syntax
        run: python3 -m py_compile examples/hardened-mcp-server/server.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test

      - name: Build release
        working-directory: rust
        run: cargo build --release
